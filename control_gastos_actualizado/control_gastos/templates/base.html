<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Gastos - Registro</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 950px; margin: 40px auto; padding: 0 20px; color: #222; }
        nav a { margin-right: 15px; text-decoration: none; color: #2c5f9e; font-weight: bold; }
        h1 { font-size: 1.4em; }
        h2 { font-size: 1.1em; margin-top: 35px; }
        form { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        label { font-weight: bold; }
        input, select { padding: 8px; font-size: 1em; }
        button { padding: 10px; background: #2c5f9e; color: white; border: none; cursor: pointer; }
        .flash { padding: 10px; margin-top: 15px; border-radius: 4px; }
        .flash-exito { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .flash-error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .flash-aviso { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.95em; }
        th { background: #f1f4f8; }
        .acciones { display: flex; gap: 8px; align-items: center; }
        .acciones form { margin: 0; flex-direction: row; }
        .btn-editar { color: #2c5f9e; text-decoration: none; font-weight: bold; }
        .btn-eliminar { padding: 6px 10px; background: #c0392b; font-size: 0.85em; }
        .btn-cancelar { align-self: flex-start; color: #555; text-decoration: none; }

        .semana-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .semana-nav a { text-decoration: none; color: #2c5f9e; font-weight: bold; white-space: nowrap; }
        .semana-nav .rango-semana { font-weight: bold; }
        .calendario { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .dia-columna { border: 1px solid #ddd; border-radius: 4px; padding: 8px; min-height: 160px; display: flex; flex-direction: column; background: #fafafa; }
        .dia-columna.dia-hoy { background: #eef4fc; border-color: #2c5f9e; }
        .dia-columna h3 { font-size: 0.8em; margin: 0 0 8px 0; text-align: center; }
        .dia-columna .fecha-dia { display: block; font-weight: normal; color: #666; font-size: 0.9em; }
        .dia-columna ul { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .dia-columna li { font-size: 0.78em; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed #ddd; }
        .sin-gastos { font-size: 0.78em; color: #999; text-align: center; flex-grow: 1; }
        .total-dia { font-size: 0.78em; font-weight: bold; text-align: right; border-top: 1px solid #ddd; padding-top: 4px; margin-top: 4px; }
        .total-semana { text-align: right; font-size: 1.1em; margin-top: 15px; }
        @media (max-width: 700px) {
            .calendario { grid-template-columns: 1fr; }
        }

        .metricas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 15px; margin-top: 10px; }
        .metrica-card { border: 1px solid #ddd; border-radius: 6px; padding: 15px; background: #fafafa; }
        .metrica-card.ok { border-left: 4px solid #2e8b57; }
        .metrica-card.aviso { background: #fff8e1; border-color: #ffe08a; border-left: 4px solid #e0a100; }
        .metrica-card.alerta { background: #fdecea; border-color: #f1b0a8; border-left: 4px solid #c0392b; }
        .metrica-label { font-size: 0.8em; color: #555; margin-bottom: 6px; font-weight: bold; }
        .metrica-valor { font-size: 1.5em; font-weight: bold; color: #2c5f9e; }
        .metrica-card.aviso .metrica-valor { color: #9a6b00; }
        .metrica-card.alerta .metrica-valor { color: #c0392b; }
        .metrica-detalle { font-size: 0.8em; color: #555; margin-top: 4px; }
        .metrica-porque { font-size: 0.75em; color: #666; border-top: 1px dashed #ccc; margin-top: 10px; padding-top: 8px; line-height: 1.4; }
        .nota-metricas { font-size: 0.85em; color: #555; margin: 0; }
        .grupo-desc { font-size: 0.85em; color: #666; margin: -5px 0 0 0; }
        .texto-alerta { color: #c0392b; font-weight: bold; }
        .barra-contenedor { background: #e9ecef; border-radius: 4px; height: 10px; width: 100%; overflow: hidden; }
        .barra-relleno { background: #2c5f9e; height: 100%; }
        .barra-relleno.aviso { background: #e0a100; }
        .barra-relleno.alerta { background: #c0392b; }
        .barra-texto { font-size: 0.75em; color: #555; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('metricas.index') }}">Métricas</a>
        <a href="{{ url_for('gastos.index') }}">Registrar Gasto</a>
        <a href="{{ url_for('gastos.calendario') }}">Calendario Semanal</a>
        <a href="{{ url_for('categorias.index') }}">Registrar Categoría</a>
    </nav>
    <hr>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% if mensajes %}
            {% for categoria, mensaje in mensajes %}
                <div class="flash flash-{{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
